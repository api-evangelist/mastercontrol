aid: mastercontrol
name: MasterControl
description: 'MasterControl is a Salt Lake City based software company that builds cloud quality
  management (QMS) and manufacturing execution (MES) software for regulated industries, primarily life
  sciences — pharmaceutical, biotechnology, medical device, CRO/CDMO, and food and beverage
  manufacturers. Its platform spans document control, training, CAPA, change control, audit,
  supplier quality, electronic batch records, and production records, and is built to support
  FDA 21 CFR Part 11, EU MDR, GDPR and HIPAA obligations. MasterControl exposes RESTful APIs for its
  Qx (Quality Excellence) and Mx (Manufacturing Excellence) products through a separately licensed
  API Toolkit, used to integrate the quality system with ERP, CRM, MES, PDM and document
  repositories; the API reference is published as a Swagger UI inside each customer tenant rather
  than on a public developer portal.'
